diffusion_planner:
  _target_: diffusion_planner.planner.planner.DiffusionPlanner
  _convert_: "all"

  config:
    _target_: diffusion_planner.utils.config.Config
    _convert_: "all"

    args_file: ???

    guidance_fn:
      _target_: diffusion_planner.model.guidance.guidance_wrapper.GuidanceWrapper
      _convert_: "all"

  ckpt_path: ???

  past_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 20
    time_horizon: 2

  future_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 80
    time_horizon: 8

  device: cuda

  # Novelty 8 -- momentum-aware inference (MomAD TTM + Ouroboros warm-start).
  # Defaults reproduce upstream behaviour bit-identically.
  use_ttm: false
  warm_start_alpha: 0.0
  n_samples: 1

  # Conformal Risk Control safety tier (opt-in). ``tau_safe=0.0`` is the
  # monitor-only default; raise it to actually trigger the fallback.
  use_conformal_safety: false
  reward_ckpt: null
  conformal_calibration_path: null
  tau_safe: 0.0
  fallback_decel: 0.0
